# `v2` is the source. `main` is a build artifact.
#
# This repo exists to end the habit of authoring one idea several times, so it does not get
# to keep two hand-maintained branches of its own. A change is written once on `v2`, and
# `main` — the Claude Code flavour, which is what the marketplace serves — is rebuilt from
# it.
#
# On a pull request it only *checks* that the build works and that the generated tree still
# passes the gates. Nothing is published until `v2` itself moves.
name: Generate main

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # The generated tree is published to `main`, so both refs have to be reachable.
      #
      # Recursively, because `check.py` compares this repo's generator against the copy
      # in each stack. That file is byte-identical in three repos and was kept so by
      # hand; the submodules are what finally make the drift checkable, and a
      # non-recursive checkout would let the check skip itself into uselessness.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # No setup step, by design: the generator and the gates are stdlib-only Python so
      # that the same files run unchanged in the Node consuming repo, which has no Python
      # toolchain of its own.
      # `--since` compares against what this ref is changing, so the version-bump gate
      # knows whether layer A actually moved. On a PR that is the base commit; on a push
      # to `v2` it is the previous tip.
      - name: Gate this ref
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="$(git rev-parse HEAD~1 2>/dev/null || echo '')"; fi
          if [ -n "$base" ]; then
            python3 scripts/check.py --since="$base"
          else
            python3 scripts/check.py
          fi

      # Layer A is copied verbatim into two repositories that format Markdown
      # differently: one runs Prettier over `*.md`, the other does not. Shared prose under
      # two formatters reflows on every commit, and a reflow breaks the vendored copy's
      # sha check on every sync. So the plugin owns its own formatting, both consumers
      # exclude the vendored tree from theirs, and this is where that is enforced.
      #
      # `npx` rather than a dependency: this repo has no package.json and should not grow
      # one for a formatter. The runner has Node; the check is pinned by major version.
      - name: The plugin owns its own formatting
        run: npx --yes prettier@3 --check .

      - name: Build the main tree from this ref
        run: python3 .agents/transform/generate_main.py . "${RUNNER_TEMP}/main"

      # A generated branch is only as trustworthy as its gates. Running them against the
      # built tree is what makes "nobody hand-edits main" safe to say: a change on `v2`
      # that would break the Claude-specific branch fails here, on `v2`, rather than after
      # the fact on a branch nobody reads.
      #
      # `.agents/` is dropped from `main`, so the generator is gone from the built tree and
      # its own generation check cannot run there. The manifest gates still can.
      - name: Gate the generated tree
        working-directory: ${{ runner.temp }}/main
        run: python3 "${GITHUB_WORKSPACE}/scripts/check.py" --manifests-only

      - name: Publish to main
        if: github.event_name == 'push'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_subject="$(git log -1 --format=%s)"

          git fetch origin main || echo "main does not exist yet"
          rm -rf "${RUNNER_TEMP}/publish"
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            git worktree add --detach "${RUNNER_TEMP}/publish" origin/main
          else
            git worktree add --detach --no-checkout "${RUNNER_TEMP}/publish" HEAD
          fi
          cd "${RUNNER_TEMP}/publish"

          # Replace the tree wholesale: a file deleted on `v2` has to disappear here too.
          # Gitlinks first and by hand: this worktree was made non-recursively, so the
          # submodule directories are empty and `git rm -r .` is not reliably willing to
          # take a submodule it cannot see into.
          # Not `path`: zsh ties that name to `$PATH`, and these lines get pasted into
          # a terminal when somebody is debugging a bad publish.
          for link in $(git ls-files --stage | awk -F'\t' '$1 ~ /^160000 /{print $2}'); do
            git rm -rq --cached --ignore-unmatch "$link" || true
            rm -rf "$link"
          done
          git rm -rq --ignore-unmatch . || true
          cp -a "${RUNNER_TEMP}/main/." .
          git add -A

          # `main` carries the same two submodules as `v2`, pointed at the stacks' own
          # `main`. This repo's default branch is `main`, so a plain
          # `git clone --recursive` lands somebody there — and a meta-repo whose
          # submodules only exist on the branch you did not clone is not a meta-repo.
          #
          # The generator cannot emit these: it writes a directory tree, and a gitlink
          # lives in the index rather than on disk. It skips them, and they are restored
          # here against each stack's current tip. `.gitmodules` was copied from the
          # generated tree, so `branch` already reads `main` — that substitution is a
          # region in the source file, not a rule hidden in this workflow.
          for key in $(git config -f .gitmodules --name-only --get-regexp '^submodule\..*\.path$'); do
            name="${key#submodule.}"
            name="${name%.path}"
            link="$(git config -f .gitmodules --get "submodule.${name}.path")"
            url="$(git config -f .gitmodules --get "submodule.${name}.url")"
            branch="$(git config -f .gitmodules --get "submodule.${name}.branch")"
            sha="$(git ls-remote "$url" "refs/heads/${branch}" | cut -f1)"
            if [ -z "$sha" ]; then
              echo "::error::${url} has no ${branch} branch -- cannot pin ${link}"
              exit 1
            fi
            echo "pinning ${link} at ${branch} ${sha}"
            git update-index --add --cacheinfo "160000,${sha},${link}"
          done

          if git diff --cached --quiet; then
            echo "main is already current"
            exit 0
          fi

          git commit -q \
            -m "build: regenerate main from v2@${source_sha:0:7}" \
            -m "${source_subject}" \
            -m "Generated by .github/workflows/generate-main.yml. Do not edit main by hand — the next push to v2 rebuilds it."
          # The lease refuses the push when `main` moved after this job read it, which is
          # the signal that somebody edited the artifact by hand and their work is about to
          # be overwritten.
          # Fully qualified: on the very first run `main` does not exist yet, and git
          # refuses to guess a destination ref it cannot already see.
          git push --force-with-lease origin HEAD:refs/heads/main
