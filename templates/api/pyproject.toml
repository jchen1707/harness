[project]
name = "__PROJECT__-api"
version = "0.1.0"
description = "The __PROJECT__ HTTP API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]

[dependency-groups]
dev = ["httpx2>=0.1", "mypy>=1.11", "pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is the point of a test

# mypy checks the paths named here and nothing else, and it skips dot-directories during
# its own discovery. A new top-level directory is silently unchecked while this stays
# green - add it here in the same change that creates it.
[tool.mypy]
files = ["src", "tests", "scripts"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
